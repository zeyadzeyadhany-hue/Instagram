<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-card">
        <div class="icon-container">
  <div class="insta-icon"></div>
<h1>𝓘𝓷𝓼𝓽𝓪𝓰𝓻𝓪𝓶</h1>
        <p>Capture what's special. share it with the world.</p>

        <form id="loginForm">
            <input
                type="text"
                placeholder="Username,email or phone number"
                autocomplete="off"
                required
            >

            <input
                type="password"
                placeholder="password"
                autocomplete="off"
                required
            >

            <button type="submit">Log in</button>
        </form>

        <p id="message" aria-live="polite"></p>
    </main>

<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = form.querySelector("button");

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        button.disabled = true;
        button.textContent = "Analyzing...";
        message.textContent = "جاري التحليل... 🔍";

        setTimeout(function () {
            message.textContent =
                "😂 اتقفشت يا نجم! دي صفحة تجريبية أنا عاملها بنفسي. مفيش بيانات اتبعتت أو اتحفظت.";
            button.textContent = "Try demo login";
            button.disabled = false;
        }, 2000);
    });
</script>

</body>
</html>
